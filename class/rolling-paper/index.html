<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>롤링페이퍼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&family=Hi+Melody&family=Jua&family=Nanum+Pen+Script&family=Poor+Story&display=swap" rel="stylesheet">
<style>
:root{
  --ui-bg:#fff; --ui-ink:#1f2328; --ui-muted:#6b6f76; --ui-line:#e3e3de; --ui-soft:#f4f3ef;
  --accent:#e2557b; --accent-ink:#fff; --shadow:0 10px 30px rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ui-bg:#22252b; --ui-ink:#e8e9eb; --ui-muted:#9aa0a8; --ui-line:#363a42; --ui-soft:#2b2f36;
    --accent:#ff7fa0; --accent-ink:#2a1018; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ui-bg:#22252b; --ui-ink:#e8e9eb; --ui-muted:#9aa0a8; --ui-line:#363a42; --ui-soft:#2b2f36;
  --accent:#ff7fa0; --accent-ink:#2a1018; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ui-ink); background:#c89b6d; line-height:1.5; -webkit-text-size-adjust:100%;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* ---------- 벽(배경) ---------- */
.wall{overflow-x:clip;min-height:100vh;min-height:100dvh;padding:18px 16px 110px;--wall-ink:#3b2a1a;--wall-sub:rgba(59,42,26,.7)}
.t-cork{background-color:#c89b6d;background-image:
  radial-gradient(circle at 20% 30%,rgba(90,55,25,.35) 0 1.2px,transparent 1.6px),
  radial-gradient(circle at 70% 60%,rgba(255,235,200,.35) 0 1px,transparent 1.4px),
  radial-gradient(circle at 40% 80%,rgba(90,55,25,.25) 0 1.6px,transparent 2px);
  background-size:13px 13px,17px 17px,23px 23px}
.t-chalk{background-color:#2f4b3c;background-image:
  radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px),
  linear-gradient(160deg,rgba(255,255,255,.05),rgba(0,0,0,.12));
  background-size:9px 9px,100% 100%;--wall-ink:#f4f1e6;--wall-sub:rgba(244,241,230,.75)}
.t-pink{background-color:#ffe3ec;background-image:radial-gradient(#ffc4d6 2.5px,transparent 3px);background-size:26px 26px;--wall-ink:#7a2846;--wall-sub:rgba(122,40,70,.7)}
.t-sky{background-color:#1d2747;background-image:
  radial-gradient(rgba(255,255,255,.85) .9px,transparent 1.3px),
  radial-gradient(rgba(255,240,180,.6) 1.2px,transparent 1.7px),
  linear-gradient(180deg,#151c38,#2c3a6b);
  background-size:37px 41px,71px 67px,100% 100%;background-position:0 0,19px 23px,0 0;--wall-ink:#fff6d6;--wall-sub:rgba(255,246,214,.75)}
.t-grid{background-color:#f7f4ec;background-image:
  linear-gradient(rgba(90,120,170,.14) 1px,transparent 1px),
  linear-gradient(90deg,rgba(90,120,170,.14) 1px,transparent 1px);
  background-size:22px 22px;--wall-ink:#2c3c5a;--wall-sub:rgba(44,60,90,.7)}
.t-mint{background-color:#d9f1e6;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 14px,transparent 14px 28px);--wall-ink:#1f5440;--wall-sub:rgba(31,84,64,.7)}

/* ---------- 머리말 ---------- */
.head{max-width:1280px;margin:0 auto 18px;text-align:center;position:relative}
.head h1{font-family:"Jua",sans-serif;font-weight:400;font-size:clamp(1.8rem,6vw,3rem);line-height:1.2;margin:14px 0 4px;color:var(--wall-ink);word-break:keep-all;text-shadow:0 2px 0 rgba(255,255,255,.25)}
.head .sub{color:var(--wall-sub);font-size:.9rem;margin:0}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{border:0;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.85);color:#2a2a2a;font-size:.88rem;box-shadow:0 2px 6px rgba(0,0,0,.12);display:inline-flex;gap:6px;align-items:center}
.chip:active{transform:translateY(1px)}
.t-chalk .chip,.t-sky .chip{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25)}
.banner{max-width:640px;margin:10px auto 0;font-size:.82rem;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.8);color:#5b4a2a;text-align:center}
.t-chalk .banner,.t-sky .banner{background:rgba(255,255,255,.12);color:#fff}

/* ---------- 메모 배치 ---------- */
.board{max-width:1280px;margin:0 auto;display:flex;gap:var(--gap,18px);align-items:flex-start}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:var(--gap,18px)}
.empty{max-width:420px;margin:40px auto;text-align:center;color:var(--wall-ink);font-family:"Gaegu",cursive;font-size:1.5rem}
.empty small{display:block;font-family:system-ui,sans-serif;font-size:.85rem;color:var(--wall-sub);margin-top:6px}

/* ---------- 메모지 ---------- */
.note{position:relative;padding:22px 16px 16px;border-radius:3px;color:var(--ink,#2b2b2b);
  box-shadow:0 1px 1px rgba(0,0,0,.08),0 6px 14px rgba(0,0,0,.18);
  transform:rotate(var(--rot,0deg)) translate(var(--dx,0),0);transition:transform .2s ease;word-break:break-word}
.note:hover{transform:rotate(0deg) scale(1.02);z-index:3}
.note.new{animation:stick .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes stick{from{transform:rotate(calc(var(--rot) * -3)) scale(1.25) translateY(-30px);opacity:0}to{opacity:1}}
.note .msg{white-space:pre-wrap;font-size:calc(1.15rem * var(--fs,1));line-height:1.55;margin:0;min-height:2.5em}
.note .from{margin:10px 0 0;text-align:right;font-size:calc(1rem * var(--fs,1));opacity:.85}
.note .from::before{content:"from. "}
.note .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(0,0,0,.08);color:inherit;font-size:16px;line-height:1;opacity:0;transition:opacity .15s}
.note:hover .x,.note:focus-within .x{opacity:1}
@media (hover:none){.note .x{opacity:.7}}
.note .stk{position:absolute;right:-8px;bottom:-12px;font-size:2.1rem;transform:rotate(12deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));pointer-events:none;line-height:1}

/* 종이 */
.p-yellow{background:#fff3a3}
.p-pink{background:#ffd3df}
.p-mint{background:#c7f0da}
.p-sky{background:#cde4ff}
.p-lilac{background:#e3d5ff}
.p-peach{background:#ffd9bd}
.p-lined{background-color:#fffdf5;background-image:linear-gradient(90deg,transparent 30px,rgba(230,90,90,.35) 30px 31.5px,transparent 31.5px),repeating-linear-gradient(transparent 0 calc(1.55em - 1px),rgba(80,130,200,.3) calc(1.55em - 1px) 1.55em);background-position:0 0,0 21px;padding-left:40px}
.p-graph{background-color:#fff;background-image:linear-gradient(rgba(70,140,120,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(70,140,120,.18) 1px,transparent 1px);background-size:14px 14px}
.p-kraft{background-color:#d6b384;background-image:radial-gradient(rgba(120,80,30,.18) 1px,transparent 1.4px);background-size:7px 7px}
.p-polka{background-color:#fff8ee;background-image:radial-gradient(rgba(255,140,160,.35) 3px,transparent 3.5px);background-size:22px 22px}
.p-night{background:linear-gradient(160deg,#2f3a6e,#4b3a7a)}
.p-cloud{background:linear-gradient(180deg,#e8f4ff,#ffe9f3)}

/* 꾸미기 */
.d-tape::before{content:"";position:absolute;top:-11px;left:50%;width:84px;height:24px;transform:translateX(-50%) rotate(var(--trot,-3deg));
  background:var(--tape,rgba(255,180,200,.75));
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px);
  box-shadow:0 1px 2px rgba(0,0,0,.12);
  -webkit-mask:linear-gradient(90deg,transparent 0 2px,#000 2px calc(100% - 2px),transparent calc(100% - 2px));mask:linear-gradient(90deg,transparent 0 2px,#000 2px calc(100% - 2px),transparent calc(100% - 2px))}
.d-pin::before{content:"";position:absolute;top:-8px;left:50%;width:20px;height:20px;margin-left:-10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 2px,var(--pin,#e23b4f) 3px 100%);box-shadow:2px 4px 4px rgba(0,0,0,.3)}
.d-corner::before,.d-corner::after{content:"";position:absolute;width:46px;height:16px;background:var(--tape,rgba(255,220,120,.8));box-shadow:0 1px 2px rgba(0,0,0,.12)}
.d-corner::before{top:-2px;left:-14px;transform:rotate(-40deg)}
.d-corner::after{bottom:-2px;right:-14px;transform:rotate(-40deg)}

/* 글씨 */
.f-pen{font-family:"Nanum Pen Script",cursive;--fs:1.35}
.f-gaegu{font-family:"Gaegu",cursive;--fs:1.08}
.f-gamja{font-family:"Gamja Flower",cursive;--fs:1.05}
.f-melody{font-family:"Hi Melody",cursive;--fs:1.12}
.f-poor{font-family:"Poor Story",cursive;--fs:1.02}
.f-jua{font-family:"Jua",sans-serif;--fs:.95}

/* ---------- 버튼 ---------- */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:20;border:0;border-radius:999px;padding:15px 22px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem;box-shadow:0 8px 20px rgba(0,0,0,.28);display:flex;gap:8px;align-items:center}
.fab:active{transform:scale(.97)}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--ui-soft);color:var(--ui-ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:default}

/* ---------- 창 ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(20,15,10,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.panel{background:var(--ui-bg);color:var(--ui-ink);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px)}}
@media (min-width:640px){.sheet{align-items:center}.panel{border-radius:18px}}
.panel h2{margin:0 0 12px;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.panel h2 button{border:0;background:none;font-size:1.4rem;line-height:1;padding:4px 8px;color:var(--ui-muted)}
.lbl{font-size:.8rem;font-weight:600;color:var(--ui-muted);margin:14px 0 6px}
.field{width:100%;border:1px solid var(--ui-line);background:var(--ui-soft);border-radius:10px;padding:10px 12px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:110px}
.count{text-align:right;font-size:.75rem;color:var(--ui-muted);margin-top:2px}
.opts{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.opt{flex:0 0 auto;border:2px solid transparent;border-radius:10px;background:var(--ui-soft);padding:0;min-width:44px;height:44px;display:grid;place-items:center;position:relative}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.opt.sw{width:44px}
.opt.sw span{width:34px;height:34px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.opt.txt{padding:0 12px;font-size:1.15rem;color:var(--ui-ink)}
.opt.ink span{width:24px;height:24px;border-radius:50%}
.opt.emo{font-size:1.5rem;width:44px}
.opt.th{width:64px;height:48px;overflow:hidden}
.opt.th span:first-child{position:absolute;inset:3px;border-radius:6px}
.opt .nm{position:absolute;bottom:3px;left:3px;right:3px;border-radius:0 0 6px 6px;font-size:.62rem;text-align:center;color:#333;background:rgba(255,255,255,.7)}
.preview{position:sticky;top:-18px;z-index:2;padding:26px 18px 22px;border-radius:0 0 12px 12px;background:var(--ui-soft);margin:0 -16px 4px;box-shadow:0 6px 10px -8px rgba(0,0,0,.25)}
.preview .note{max-width:300px;margin:0 auto}
.preview .note:hover{transform:rotate(var(--rot)) translate(var(--dx,0),0)}
.row{display:flex;gap:8px;margin-top:18px}
.row .btn{flex:1}
.err{color:#d23a3a;font-size:.85rem;margin:8px 0 0}
.linkbox{display:flex;gap:6px}
.linkbox input{flex:1;min-width:0;font-size:.85rem}
.hint{font-size:.8rem;color:var(--ui-muted);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:fade .2s;max-width:calc(100% - 32px);text-align:center}

/* ---------- 첫 화면 ---------- */
.home{max-width:520px;margin:0 auto;padding-top:4vh}
.home .card{background:var(--ui-bg);color:var(--ui-ink);border-radius:18px;padding:20px 16px;box-shadow:var(--shadow)}
.home .hero{text-align:center;margin-bottom:18px;color:var(--wall-ink)}
.home .hero h1{font-family:"Jua",sans-serif;font-weight:400;font-size:2.4rem;margin:0}
.home .hero p{margin:4px 0 0;color:var(--wall-sub)}
.mine{list-style:none;margin:0;padding:0}
.mine li a{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;color:var(--ui-ink);text-decoration:none;border-top:1px solid var(--ui-line)}
.mine li a span{color:var(--ui-muted);font-size:.8rem}
.deco-notes{display:flex;justify-content:center;gap:10px;margin:0 0 18px}
.deco-notes .note{width:92px;height:80px;padding:18px 8px 8px;font-size:.95rem;text-align:center;font-family:"Gaegu",cursive}
.deco-notes .note:hover{transform:rotate(var(--rot))}
</style>
</head>
<body>
<div id="app" class="wall t-cork"></div>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script>
(() => {
  // 구글 시트 Apps Script 웹 앱 주소 (apps-script.gs 참고). 비워 두면 이 기기에만 저장되는 연습 모드.
  const SHEET_URL = "";

  // ---------- 고를 수 있는 것들 ----------
  const PAPERS = [
    ["yellow","노랑","#fff3a3"],["pink","분홍","#ffd3df"],["mint","민트","#c7f0da"],["sky","하늘","#cde4ff"],
    ["lilac","보라","#e3d5ff"],["peach","살구","#ffd9bd"],["lined","줄노트","#fffdf5"],["graph","모눈","#fff"],
    ["polka","땡땡이","#fff8ee"],["kraft","크라프트","#d6b384"],["cloud","솜사탕","linear-gradient(180deg,#e8f4ff,#ffe9f3)"],
    ["night","밤하늘","linear-gradient(160deg,#2f3a6e,#4b3a7a)"],
  ];
  const FONTS = [["pen","나눔손글씨"],["gaegu","개구"],["gamja","감자꽃"],["melody","하이멜로디"],["poor","푸어스토리"],["jua","주아"]];
  const INKS = [["#2b2b2b","검정"],["#1f4fa8","파랑"],["#b0304a","빨강"],["#5b3a9e","보라"],["#2e6b46","초록"],["#ffffff","흰색"]];
  const DECOS = [["tape","🩹","마스킹테이프"],["pin","📌","압정"],["corner","📐","모서리 테이프"],["none","✕","없음"]];
  const STICKERS = ["","💖","🌸","⭐","🎉","🍀","🐻","🐰","🌈","🎈","🍓","✨","🎓","🌷","🐥","🍰"];
  const THEMES = [["cork","코르크"],["chalk","칠판"],["pink","핑크"],["sky","밤하늘"],["grid","모눈"],["mint","민트"]];
  const TAPES = ["rgba(255,170,195,.8)","rgba(150,205,255,.8)","rgba(255,220,120,.85)","rgba(170,230,190,.85)","rgba(205,180,255,.8)","rgba(255,190,150,.85)"];
  const PINS = ["#e23b4f","#2f7de1","#f2b705","#2fa85a","#9b4fd6"];
  const DARK_PAPER = new Set(["night"]);
  const has = (list, v) => list.some(x => (Array.isArray(x) ? x[0] : x) === v);

  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const app = $("#app"), layer = $("#layer");

  // ---------- 기기 저장 ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const KEYS = "rp-keys", MINE = "rp-mine", LAST = "rp-last", NAME = "rp-name", DEMO = "rp-demo";

  // ---------- 서버 (또는 연습 모드) ----------
  async function api(body) {
    if (!SHEET_URL) return demo(body);
    const res = await fetch(SHEET_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
    return res.json();
  }
  function rnd(n) { const a = "abcdefghjkmnpqrstuvwxyz23456789"; let s = ""; for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
  function demo(b) {
    const db = store.get(DEMO, { boards: {}, notes: {} });
    const save = () => store.set(DEMO, db);
    const bd = db.boards[b.board];
    let r;
    if (b.action === "create") { const id = rnd(6), key = rnd(10); db.boards[id] = { id, title: b.title || "롤링페이퍼", theme: b.theme, key }; db.notes[id] = []; save(); r = { ok: true, board: id, key }; }
    else if (!bd) r = { ok: false, error: "noboard" };
    else if (b.action === "load") r = { ok: true, board: { id: bd.id, title: bd.title, theme: bd.theme }, admin: b.key === bd.key, notes: db.notes[bd.id].map(({ del, ...n }) => n) };
    else if (b.action === "add") { const n = { id: rnd(8), del: rnd(10), name: (b.name || "").trim() || "익명", text: b.text, style: b.style, at: Date.now() }; db.notes[bd.id].push(n); save(); r = { ok: true, id: n.id, del: n.del, at: n.at }; }
    else if (b.action === "delete") { const list = db.notes[bd.id]; const i = list.findIndex(n => n.id === b.id); if (i >= 0 && (b.key === bd.key || b.del === list[i].del)) { list.splice(i, 1); save(); r = { ok: true }; } else r = { ok: i < 0 }; }
    else if (b.action === "editBoard") { if (b.key !== bd.key) r = { ok: false, error: "forbidden" }; else { if (b.title != null) bd.title = b.title || "롤링페이퍼"; if (b.theme != null) bd.theme = b.theme; save(); r = { ok: true }; } }
    return Promise.resolve(JSON.parse(JSON.stringify(r)));
  }

  function toast(msg) {
    const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
  }
  function setTheme(theme) {
    app.className = "wall t-" + (has(THEMES, theme) ? theme : "cork");
    const bg = getComputedStyle(app).backgroundColor;
    document.body.style.background = bg;
    const m = $('meta[name="theme-color"]') || Object.assign(document.head.appendChild(document.createElement("meta")), { name: "theme-color" });
    m.content = bg;
  }

  // ---------- 메모지 그리기 ----------
  function noteEl(n, opts = {}) {
    const s = n.style || {};
    const paper = has(PAPERS, s.paper) ? s.paper : "yellow";
    const font = has(FONTS, s.font) ? s.font : "gaegu";
    const deco = has(DECOS, s.deco) ? s.deco : "tape";
    let ink = INKS.some(i => i[0] === s.ink) ? s.ink : (DARK_PAPER.has(paper) ? "#ffffff" : "#2b2b2b");
    if (DARK_PAPER.has(paper) && ink === "#2b2b2b") ink = "#ffffff";
    if (!DARK_PAPER.has(paper) && ink === "#ffffff") ink = "#2b2b2b";
    const sticker = STICKERS.includes(s.sticker) ? s.sticker : "";
    const h = hash(n.id || "preview");
    const el = document.createElement("article");
    el.className = `note p-${paper} f-${font} d-${deco}`;
    el.style.setProperty("--rot", ((h % 90) / 10 - 4.5).toFixed(1) + "deg");
    el.style.setProperty("--dx", ((h >> 7) % 9 - 4) + "px");
    el.style.setProperty("--ink", ink);
    el.style.setProperty("--tape", TAPES[(h >> 3) % TAPES.length]);
    el.style.setProperty("--trot", ((h >> 5) % 9 - 4) + "deg");
    el.style.setProperty("--pin", PINS[(h >> 4) % PINS.length]);
    el.innerHTML = `<p class="msg">${esc(n.text) || '<span style="opacity:.45">여기에 마음을 적어 주세요</span>'}</p>`
      + `<p class="from">${esc(n.name || "익명")}</p>`
      + (sticker ? `<span class="stk">${sticker}</span>` : "")
      + (opts.deletable ? `<button class="x" data-html2canvas-ignore aria-label="메모 지우기" title="지우기">×</button>` : "");
    if (opts.deletable) el.querySelector(".x").onclick = () => removeNote(n);
    return el;
  }

  // ---------- 상태 ----------
  const params = new URLSearchParams(location.search);
  let boardId = params.get("b");
  const urlKey = params.get("k");
  if (boardId && urlKey) {
    const keys = store.get(KEYS, {}); keys[boardId] = urlKey; store.set(KEYS, keys);
    params.delete("k"); history.replaceState(null, "", "?" + params.toString());
  }
  let board = null, notes = [], admin = false, seen = new Set(), justAdded = null, pollTimer = null;
  const myKey = () => store.get(KEYS, {})[boardId];
  const shareUrl = (withKey) => location.origin + location.pathname + "?b=" + boardId + (withKey ? "&k=" + myKey() : "");

  if (boardId) openBoard(); else renderHome();

  // ---------- 첫 화면 ----------
  function renderHome() {
    setTheme("cork");
    document.title = "롤링페이퍼";
    const mine = store.get(LAST, []);
    app.innerHTML = `
      <div class="home">
        <div class="hero"><h1>롤링페이퍼</h1><p>링크 하나로 다 같이 메모를 붙여요</p></div>
        <div class="deco-notes" aria-hidden="true"></div>
        <div class="card">
          <h2 style="margin:0 0 4px;font-size:1.1rem">새 롤링페이퍼 만들기</h2>
          <div class="lbl">제목</div>
          <input class="field" id="hTitle" maxlength="60" placeholder="예) 민지야 졸업 축하해! 🎓">
          <div class="lbl">게시판 배경</div>
          <div class="opts" id="hTheme"></div>
          <div class="row"><button class="btn primary" id="hGo">만들기</button></div>
          <p class="err" id="hErr" hidden></p>
          ${SHEET_URL ? "" : `<p class="hint">⚠️ 지금은 연습 모드예요. 이 기기에서만 보이고 다른 사람과 같이 쓰려면 구글 시트를 연결해야 해요.</p>`}
          ${mine.length ? `<div class="lbl" style="margin-top:22px">최근에 연 롤링페이퍼</div><ul class="mine">${mine.map(m => `<li><a href="?b=${esc(m.id)}">${esc(m.title)}<span>${store.get(KEYS, {})[m.id] ? "내가 만든 판" : ""}</span></a></li>`).join("")}</ul>` : ""}
        </div>
      </div>`;
    const deco = $(".deco-notes");
    [["yellow","gaegu","고마워!","tape"],["pink","gamja","최고야 💖","pin"],["mint","pen","힘내!","corner"]]
      .forEach(([paper, font, text, d], i) => deco.appendChild(Object.assign(noteEl({ id: "d" + i * 7, text, name: "", style: { paper, font, deco: d } }), {})));
    deco.querySelectorAll(".from").forEach(e => e.remove());
    let theme = "cork";
    const box = $("#hTheme");
    const drawThemes = () => {
      box.innerHTML = THEMES.map(([k, nm]) => `<button class="opt th" data-k="${k}" aria-pressed="${k === theme}"><span class="t-${k}"></span><span class="nm">${nm}</span></button>`).join("");
      box.querySelectorAll("button").forEach(b => b.onclick = () => { theme = b.dataset.k; setTheme(theme); drawThemes(); });
    };
    drawThemes();
    $("#hGo").onclick = async () => {
      const btn = $("#hGo"); btn.disabled = true; btn.textContent = "만드는 중…";
      try {
        const r = await api({ action: "create", title: $("#hTitle").value.trim(), theme });
        if (!r.ok) throw new Error(r.error);
        const keys = store.get(KEYS, {}); keys[r.board] = r.key; store.set(KEYS, keys);
        location.href = "?b=" + r.board + "&new=1";
      } catch (e) {
        btn.disabled = false; btn.textContent = "만들기";
        $("#hErr").hidden = false; $("#hErr").textContent = "만들지 못했어요. 인터넷 연결을 확인해 주세요.";
      }
    };
  }

  // ---------- 게시판 ----------
  async function openBoard() {
    app.innerHTML = `<div class="empty">게시판을 불러오는 중…</div>`;
    const ok = await refresh(true);
    if (!ok) return;
    if (params.get("new")) { params.delete("new"); history.replaceState(null, "", "?" + params.toString()); openShare(true); }
    clearInterval(pollTimer);
    pollTimer = setInterval(() => { if (!document.hidden && !layer.children.length) refresh(); }, 12000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  }

  async function refresh(first) {
    let r;
    try { r = await api({ action: "load", board: boardId, key: myKey() }); }
    catch (e) { if (first) app.innerHTML = `<div class="empty">불러오지 못했어요 😢<small>인터넷 연결을 확인하고 새로고침해 주세요.</small></div>`; return false; }
    if (!r.ok) {
      app.innerHTML = `<div class="empty">없는 롤링페이퍼예요.<small><a href="./">새로 만들기</a></small></div>`;
      return false;
    }
    const changed = first || JSON.stringify([r.board, r.notes.map(n => n.id)]) !== JSON.stringify([board, notes.map(n => n.id)]);
    board = r.board; notes = r.notes.sort((a, b) => (a.at || 0) - (b.at || 0)); admin = r.admin;
    const recent = store.get(LAST, []).filter(m => m.id !== boardId);
    recent.unshift({ id: boardId, title: board.title }); store.set(LAST, recent.slice(0, 8));
    if (changed) renderBoard(first);
    return true;
  }

  function renderBoard(first) {
    setTheme(board.theme);
    document.title = board.title + " · 롤링페이퍼";
    app.innerHTML = `
      <header class="head">
        <h1>${esc(board.title)}</h1>
        <p class="sub">${notes.length ? `메모 ${notes.length}장` : ""}</p>
        <div class="tools" data-html2canvas-ignore>
          <button class="chip" id="bShare">🔗 링크 공유</button>
          <button class="chip" id="bImg">🖼️ 이미지로 저장</button>
          ${admin ? `<button class="chip" id="bEdit">⚙️ 판 꾸미기</button>` : ""}
          <a class="chip" href="./" style="text-decoration:none">＋ 새 판</a>
        </div>
        ${SHEET_URL ? "" : `<p class="banner" data-html2canvas-ignore>연습 모드: 이 기기에만 저장돼요.</p>`}
      </header>
      <div class="board" id="board"></div>
      <button class="fab" id="bWrite" data-html2canvas-ignore>✏️ 메모 붙이기</button>`;
    $("#bShare").onclick = () => openShare(false);
    $("#bImg").onclick = saveImage;
    $("#bWrite").onclick = openWrite;
    if (admin) $("#bEdit").onclick = openEdit;
    layout(first);
  }

  // 가장 짧은 줄에 하나씩 붙이기 (먼저 쓴 메모 자리가 바뀌지 않게)
  let colCount = 0;
  function layout(first) {
    const wrap = $("#board"); if (!wrap) return;
    const w = wrap.clientWidth;
    colCount = w < 340 ? 1 : w < 640 ? 2 : Math.min(6, Math.floor(w / 240));
    wrap.style.setProperty("--gap", w < 640 ? "14px" : "22px");
    wrap.innerHTML = "";
    if (!notes.length) {
      wrap.outerHTML = `<div class="empty" id="board">아직 메모가 없어요 ✨<small>오른쪽 아래 ‘메모 붙이기’로 첫 메모를 붙여 주세요.</small></div>`;
      return;
    }
    const cols = Array.from({ length: colCount }, () => wrap.appendChild(Object.assign(document.createElement("div"), { className: "col" })));
    const mine = store.get(MINE, {});
    for (const n of notes) {
      const el = noteEl(n, { deletable: admin || !!mine[n.id] });
      if (!first && !seen.has(n.id)) el.classList.add("new");
      seen.add(n.id);
      el.id = "n-" + n.id;
      let best = cols[0];
      for (const c of cols) if (c.offsetHeight < best.offsetHeight) best = c;
      best.appendChild(el);
    }
    if (justAdded) {
      const el = document.getElementById("n-" + justAdded); justAdded = null;
      if (el) { el.classList.add("new"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
    }
  }
  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => {
    const wrap = $("#board"); if (!wrap || !board) return;
    const w = wrap.clientWidth, n = w < 340 ? 1 : w < 640 ? 2 : Math.min(6, Math.floor(w / 240));
    if (n !== colCount) layout(true);
  }, 150); });
  document.fonts && document.fonts.ready.then(() => board && layout(true));

  // ---------- 창 ----------
  function modal(html) {
    layer.innerHTML = `<div class="sheet"><div class="panel" role="dialog" aria-modal="true">${html}</div></div>`;
    const sh = layer.firstChild;
    const close = () => { layer.innerHTML = ""; document.removeEventListener("keydown", onKey); };
    const onKey = e => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    sh.addEventListener("click", e => { if (e.target === sh) close(); });
    sh.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
    return { el: sh, close };
  }
  function optRow(box, items, cur, render, onPick) {
    box.innerHTML = items.map(it => render(it, (Array.isArray(it) ? it[0] : it) === cur)).join("");
    box.querySelectorAll("button").forEach((b, i) => b.onclick = () => { onPick(Array.isArray(items[i]) ? items[i][0] : items[i]); });
  }

  // ---------- 메모 쓰기 ----------
  function openWrite() {
    const last = store.get("rp-style", {});
    const st = {
      paper: has(PAPERS, last.paper) ? last.paper : PAPERS[Math.floor(Math.random() * 6)][0],
      font: has(FONTS, last.font) ? last.font : "gaegu",
      ink: last.ink || "#2b2b2b", deco: last.deco || "tape", sticker: last.sticker ?? "💖",
    };
    const m = modal(`
      <h2>메모 붙이기 <button data-close aria-label="닫기">×</button></h2>
      <div class="preview" id="wPrev"></div>
      <div class="lbl">하고 싶은 말</div>
      <textarea class="field" id="wText" maxlength="500" placeholder="마음을 담아 적어 주세요"></textarea>
      <div class="count"><span id="wCnt">0</span>/500</div>
      <div class="lbl">이름</div>
      <input class="field" id="wName" maxlength="20" placeholder="비워 두면 ‘익명’">
      <div class="lbl">메모지</div><div class="opts" id="wPaper"></div>
      <div class="lbl">글씨체</div><div class="opts" id="wFont"></div>
      <div class="lbl">글씨 색</div><div class="opts" id="wInk"></div>
      <div class="lbl">붙이는 방법</div><div class="opts" id="wDeco"></div>
      <div class="lbl">스티커</div><div class="opts" id="wStk"></div>
      <p class="err" id="wErr" hidden></p>
      <div class="row"><button class="btn" data-close>취소</button><button class="btn primary" id="wGo">붙이기</button></div>`);
    const text = $("#wText"), name = $("#wName");
    name.value = store.get(NAME, "");
    const preview = () => {
      const p = $("#wPrev"); p.innerHTML = "";
      p.appendChild(noteEl({ id: "preview", text: text.value, name: name.value.trim() || "익명", style: st }));
      $("#wCnt").textContent = text.value.length;
    };
    const draw = () => {
      optRow($("#wPaper"), PAPERS, st.paper, ([k, nm, c], on) => `<button class="opt sw" aria-pressed="${on}" title="${nm}" aria-label="${nm}"><span class="p-${k}" style="background-size:auto"></span></button>`, v => { st.paper = v; draw(); });
      optRow($("#wFont"), FONTS, st.font, ([k, nm], on) => `<button class="opt txt f-${k}" aria-pressed="${on}">${nm}</button>`, v => { st.font = v; draw(); });
      optRow($("#wInk"), INKS, st.ink, ([c, nm], on) => `<button class="opt sw ink" aria-pressed="${on}" title="${nm}" aria-label="${nm}"><span style="background:${c};box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)"></span></button>`, v => { st.ink = v; draw(); });
      optRow($("#wDeco"), DECOS, st.deco, ([k, e, nm], on) => `<button class="opt txt" aria-pressed="${on}" style="font-size:.9rem">${e} ${nm}</button>`, v => { st.deco = v; draw(); });
      optRow($("#wStk"), STICKERS, st.sticker, (e, on) => `<button class="opt emo" aria-pressed="${on}" aria-label="${e || "스티커 없음"}">${e || '<span style="font-size:.8rem;color:var(--ui-muted)">없음</span>'}</button>`, v => { st.sticker = v; draw(); });
      preview();
    };
    text.oninput = name.oninput = preview;
    draw();
    setTimeout(() => text.focus({ preventScroll: true }), 50);
    $("#wGo").onclick = async () => {
      const err = $("#wErr");
      if (!text.value.trim()) { err.hidden = false; err.textContent = "하고 싶은 말을 적어 주세요."; text.focus(); return; }
      const btn = $("#wGo"); btn.disabled = true; btn.textContent = "붙이는 중…";
      try {
        const r = await api({ action: "add", board: boardId, name: name.value.trim(), text: text.value.trim(), style: st });
        if (!r.ok) throw new Error(r.error);
        const mine = store.get(MINE, {}); mine[r.id] = r.del; store.set(MINE, mine);
        store.set(NAME, name.value.trim()); store.set("rp-style", st);
        m.close();
        justAdded = r.id;
        await refresh();
        toast("메모를 붙였어요! 💌");
      } catch (e) {
        btn.disabled = false; btn.textContent = "붙이기";
        err.hidden = false;
        err.textContent = e.message === "full" ? "이 판은 메모가 가득 찼어요." : "붙이지 못했어요. 잠시 뒤 다시 해 주세요.";
      }
    };
  }

  async function removeNote(n) {
    if (!confirm(`‘${n.name}’ 메모를 지울까요?`)) return;
    const mine = store.get(MINE, {});
    try {
      const r = await api({ action: "delete", board: boardId, id: n.id, del: mine[n.id], key: myKey() });
      if (!r.ok) throw new Error(r.error);
      delete mine[n.id]; store.set(MINE, mine);
      notes = notes.filter(x => x.id !== n.id);
      renderBoard(true);
      toast("메모를 지웠어요.");
    } catch (e) { toast("지우지 못했어요."); }
  }

  // ---------- 공유 ----------
  function openShare(isNew) {
    const url = shareUrl(false);
    modal(`
      <h2>${isNew ? "롤링페이퍼를 만들었어요! 🎉" : "링크 공유"} <button data-close aria-label="닫기">×</button></h2>
      <p class="hint" style="margin:0 0 10px">이 링크를 받은 사람은 누구나 메모를 붙일 수 있어요.</p>
      <div class="linkbox"><input class="field" readonly value="${esc(url)}"><button class="btn primary" id="sCopy">복사</button></div>
      ${navigator.share ? `<div class="row" style="margin-top:10px"><button class="btn" id="sNative">📤 다른 앱으로 보내기</button></div>` : ""}
      ${admin ? `
        <div class="lbl" style="margin-top:22px">🔑 관리용 링크 (나만 간직하기)</div>
        <div class="linkbox"><input class="field" readonly value="${esc(shareUrl(true))}"><button class="btn" id="sCopyK">복사</button></div>
        <p class="hint">다른 기기에서 이 링크로 열면 제목·배경을 바꾸고 메모를 지울 수 있어요. 다른 사람에게는 보내지 마세요.</p>` : ""}
      ${SHEET_URL ? "" : `<p class="hint">⚠️ 연습 모드라서 다른 기기에서는 이 판이 보이지 않아요.</p>`}
      <div class="row"><button class="btn" data-close>닫기</button></div>`);
    const copy = async (text) => {
      try { await navigator.clipboard.writeText(text); toast("링크를 복사했어요."); }
      catch { const i = layer.querySelector("input"); i.select(); document.execCommand("copy"); toast("링크를 복사했어요."); }
    };
    $("#sCopy").onclick = () => copy(url);
    if ($("#sCopyK")) $("#sCopyK").onclick = () => copy(shareUrl(true));
    if ($("#sNative")) $("#sNative").onclick = () => navigator.share({ title: board.title, text: "롤링페이퍼에 메모를 남겨 주세요!", url }).catch(() => {});
  }

  // ---------- 판 꾸미기 (만든 사람) ----------
  function openEdit() {
    let theme = board.theme || "cork";
    const m = modal(`
      <h2>판 꾸미기 <button data-close aria-label="닫기">×</button></h2>
      <div class="lbl">제목</div>
      <input class="field" id="eTitle" maxlength="60" value="${esc(board.title)}">
      <div class="lbl">게시판 배경</div>
      <div class="opts" id="eTheme"></div>
      <p class="hint">메모 오른쪽 위 × 로 어떤 메모든 지울 수 있어요.</p>
      <div class="row"><button class="btn" data-close>취소</button><button class="btn primary" id="eGo">저장</button></div>`);
    const draw = () => optRow($("#eTheme"), THEMES, theme, ([k, nm], on) => `<button class="opt th" aria-pressed="${on}"><span class="t-${k}"></span><span class="nm">${nm}</span></button>`, v => { theme = v; setTheme(v); draw(); });
    draw();
    const close = m.close;
    m.el.querySelectorAll("[data-close]").forEach(b => b.onclick = () => { setTheme(board.theme); close(); });
    $("#eGo").onclick = async () => {
      const btn = $("#eGo"); btn.disabled = true;
      try {
        const r = await api({ action: "editBoard", board: boardId, key: myKey(), title: $("#eTitle").value.trim(), theme });
        if (!r.ok) throw new Error(r.error);
        close(); await refresh(true); toast("저장했어요.");
      } catch { btn.disabled = false; toast("저장하지 못했어요."); }
    };
  }

  // ---------- 이미지 저장 ----------
  async function saveImage() {
    if (!window.html2canvas) { toast("잠시 뒤 다시 눌러 주세요."); return; }
    toast("이미지를 만드는 중…");
    try {
      await document.fonts?.ready;
      const canvas = await html2canvas(app, { scale: Math.min(2, window.devicePixelRatio || 1) + 0.5, backgroundColor: null, useCORS: true, windowWidth: app.scrollWidth });
      const a = document.createElement("a");
      a.download = (board.title || "롤링페이퍼").replace(/[\\/:*?"<>|]/g, "") + ".png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    } catch (e) { toast("이미지를 만들지 못했어요."); }
  }
})();
</script>
</body>
</html>
